<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>YUEB1NG share card artwork</title>
<style>
@font-face{font-family:Montreal;src:url('../../public/fonts/neue-montreal.woff')}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#f4f6fa;color:#13171f;font-family:Montreal,Arial,sans-serif}
main{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.portrait{width:196px;height:196px;border-radius:50%;padding:9px;border:1px solid #b5c8e8;position:relative;margin-top:-12px;margin-bottom:28px}
.portrait:before{content:"";position:absolute;inset:-23px;border:1px solid #dce5f4;border-radius:50%}
.portrait:after{content:"";position:absolute;width:7px;height:7px;background:#2e6fff;right:-10px;top:24px;border-radius:50%}
img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
h1{font-size:96px;font-weight:500;letter-spacing:-5px;line-height:1;margin:0 0 21px}
p{font-size:24px;margin:0;letter-spacing:4px;color:#667384}
.url{position:absolute;bottom:35px;color:#73839b;font-size:16px;letter-spacing:1.5px}
.corner{position:absolute;top:38px;left:44px;width:18px;height:18px;border-top:1px solid #a1b7d8;border-left:1px solid #a1b7d8}
.corner.end{top:auto;left:auto;bottom:38px;right:44px;transform:rotate(180deg)}
@media(max-width:600px){.portrait{width:260px;height:260px;margin:0;padding:12px}.portrait:before{inset:-30px}h1,p,.url,.corner{display:none}.portrait:after{width:9px;height:9px;right:-10px;top:28px}}
</style></head><body><main><i class="corner"></i><div class="portrait"><img src="../../public/avatar.jpg" alt="YUEB1NG"></div><h1>YUEB1NG</h1><p>Learn &nbsp; Build &nbsp; Share</p><span class="url">yueb1ng.com</span><i class="corner end"></i></main></body></html>
