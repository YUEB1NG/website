<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>(function(){var t=matchMedia('(prefers-color-scheme: dark)').matches?'night':'day';try{var saved=localStorage.getItem('yueb1ng-theme');if(saved==='night'||saved==='day')t=saved}catch(e){}var color=t==='day'?'#f4f6fa':'#000000';document.documentElement.dataset.theme=t;document.documentElement.style.backgroundColor=color;document.documentElement.style.colorScheme=t==='day'?'light':'dark';document.querySelector('meta[name="theme-color"]').content=color})()</script>
    <meta name="description" content="Wabi — an interactive prism, a quiet starfield, and a few words to uncover." />
    <title>YUEB1NG</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/neue-montreal.woff" as="font" type="font/woff" crossorigin />
  </head>
  <body>
    <div class="chrome-safe" aria-hidden="true"></div>
    <main id="wabi" aria-label="Wabi interactive experience" data-state="intro">
      <canvas id="scene" aria-hidden="true"></canvas>
      <button id="back" class="back" aria-label="Replay opening animation" title="Replay opening animation" data-blueprint="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 12H4m7-7-7 7 7 7"/></svg>
      </button>
      <button id="start" class="start" data-blueprint="copy" aria-label="Start Wabi. Swipe up, click, or press Enter.">Swipe Up To Start</button>
      <button id="orb" class="orb-hit" aria-label="Drag the prism up to enter" data-blueprint="prism"></button>
      <img id="swipe" class="swipe" src="/drag.svg" alt="" aria-hidden="true" />
      <section id="greeting" class="greeting" aria-label="Introduction" inert>
        <h1>Hi <span id="there">There.</span></h1>
        <div class="name-line">
          <div class="english-name">I'm <button class="reveal-trigger" data-reveal="name" aria-expanded="false" aria-controls="name-content">YUE<span id="name-content" class="reveal-content" data-state="closed">B1NG</span></button></div>
          <div class="profile-name" lang="zh-CN" aria-hidden="true" inert><button id="theme-toggle" class="avatar-ring" type="button" aria-label="切换到星空夜间模式" aria-pressed="false" title="点击头像切换日夜"><img src="/avatar.jpg" alt="悦饼头像" width="30" height="30" draggable="false" /></button><span id="profile-label">悦饼</span></div>
        </div>
        <p class="likes"><span>I <button id="football-toggle" class="quiet-trigger" aria-label="like — discover historic World Cup footballs">like</button> to</span> <button class="reveal-trigger word-trigger" data-reveal="word" aria-expanded="false" aria-controls="word-content"><span id="word-content" class="reveal-content" data-state="closed"><span id="flip-word" class="flip-word" aria-label="Learn"></span></span></button> <span id="everything">everything.</span></p>
      </section>
      <a id="social" class="social" href="https://x.com/yueb1ng" target="_blank" rel="noopener noreferrer" aria-label="Follow YUEB1NG on X" inert><span>Follow on</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-5-7.6L5.2 22H2l8.4-9.6L.8 2h6.5l4.6 6.9L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z" fill="currentColor"/></svg><span>@YUEB1NG</span></a>
      <p id="status" class="sr-only" aria-live="polite"></p>
      <p id="object-caption" class="object-caption" aria-hidden="true"></p>
      <button id="celebrate" class="sr-only" aria-label="Celebrate with Argentina stickers" inert>Celebrate</button>
    </main>
    <div id="blueprint" class="blueprint" aria-hidden="true"><div class="blue-sheet"><div class="blue-grid"></div><div id="drawing"></div></div><div class="wipe-edge"></div></div>
    <noscript><p class="no-script">This interactive Wabi experience needs JavaScript enabled.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
